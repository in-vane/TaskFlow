name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy, for example sha-<commit>
        required: true
        type: string

concurrency:
  group: taskflow-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PRODUCTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deployment files
        run: |
          rsync -az \
            compose.yaml \
            compose.prod.yaml \
            infra/ \
            "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:${{ secrets.PRODUCTION_DEPLOY_PATH }}/"

      - name: Deploy to production
        run: |
          ssh "${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}" \
            "cd '${{ secrets.PRODUCTION_DEPLOY_PATH }}' && \
            export GHCR_OWNER='${{ env.OWNER_LC }}' IMAGE_TAG='${{ inputs.image_tag }}' && \
            ./infra/scripts/deploy.sh"
